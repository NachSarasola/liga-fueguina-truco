    m.manualPts = !!m.manualPts;
    m.qualify = hasInt(m.qualify) ? num(m.qualify) : 0;
    m.demo = !!m.demo;
    if (!Array.isArray(m.regions) || !m.regions.length) {
      m.regions = [{ id: "ushuaia", label: "Ushuaia" }, { id: "riogrande", label: "Río Grande" }, { id: "provincial", label: "Provincial" }];
    }
    m.regions = m.regions.map(function (r, i) {
      return { id: String(r && r.id ? r.id : "r" + i), label: String(r && r.label ? r.label : (r && r.id) || "Sede " + (i + 1)) };
    });
    if (!m.regions.some(function (r) { return r.id === m.defaultRegion; })) m.defaultRegion = m.regions[0].id;
    if (!m.adminHash) m.adminHash = hashPass("truco2026");

    st.pairs = (Array.isArray(st.pairs) ? st.pairs : []).map(function (p, i) {
      p = p || {};
      return {
        id: String(p.id || "p" + (i + 1 < 10 ? "0" : "") + (i + 1)),
        name: String(p.name || ""), p1: String(p.p1 || ""), p2: String(p.p2 || "")
      };
    });

    st.standings = st.standings && typeof st.standings === "object" ? st.standings : {};
    m.regions.forEach(function (r) {
      var src = st.standings[r.id] && typeof st.standings[r.id] === "object" ? st.standings[r.id] : {};
      var out = {};
      st.pairs.forEach(function (p) {
        var s = src[p.id] || {};
        out[p.id] = {
          pg: Math.max(0, num(s.pg)), pp: Math.max(0, num(s.pp)),
          pts: hasInt(s.pts) ? num(s.pts) : (num(s.pg) * m.winPoints + num(s.pp) * m.lossPoints),
          prevRank: num(s.prevRank)
        };
      });
      st.standings[r.id] = out;
    });
  }

  var view = { mode: "board", region: null, query: "", authed: false, adminRegion: null, dirty: false, msg: null, draftInfo: null };

  function regionById(id) { for (var i = 0; i < state.meta.regions.length; i++) if (state.meta.regions[i].id === id) return state.meta.regions[i]; return null; }
  function currentRegion() { return regionById(view.region) || state.meta.regions[0]; }

  function initFromUrl() {
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h === "admin") view.mode = "admin";
    var want = h && h !== "admin" ? h : null;
    if (!want) { try { want = localStorage.getItem(LS.region); } catch (e) {} }
    view.region = regionById(want) ? want : state.meta.defaultRegion;
    view.adminRegion = view.region;
    try { if (sessionStorage.getItem(SS) === state.meta.adminHash) view.authed = true; } catch (e) {}
  }

  function ptsOf(s) {
    var m = state.meta;
    return m.manualPts ? num(s.pts) : (num(s.pg) * m.winPoints + num(s.pp) * m.lossPoints);
  }
  function rankRows(regionId) {
    var tbl = state.standings[regionId] || {};
    var rows = state.pairs.map(function (p) {
      var s = tbl[p.id] || blank();
      var pg = num(s.pg), pp = num(s.pp);
      return { pair: p, pg: pg, pp: pp, pj: pg + pp, pts: ptsOf(s), prevRank: num(s.prevRank) };
    });
    rows.sort(function (a, b) {
      return b.pts - a.pts || b.pg - a.pg || a.pp - b.pp || label(a.pair).localeCompare(label(b.pair), "es");
    });
    rows.forEach(function (r, i) { r.rank = i + 1; r.mov = r.prevRank ? (r.prevRank - r.rank) : 0; });
    return rows;
  }
  function label(p) { return p.name ? p.name : (surname(p.p1) + " / " + surname(p.p2)); }

  function initTheme() {
    var t = null;
    try { t = localStorage.getItem(LS.theme); } catch (e) {}
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }
  function isDark() {
    var c = document.documentElement.getAttribute("data-theme");
    return c ? c === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function toggleTheme() {
    var n = isDark() ? "light" : "dark";

  }

  function render() {
    if (view.mode === "admin") return view.authed ? renderAdmin() : renderGate();

  function movHTML(r) {
    if (!r.prevRank || r.mov === 0) return "";

  }
  function rowHTML(r) {
    var cls = [];
    if (r.rank <= 3) cls.push("top");

    if (state.meta.qualify && r.rank === state.meta.qualify && state.meta.qualify < state.pairs.length) cls.push("cut");
    var posNum = r.rank === 1 ? '<span class="n">' + r.rank + "</span>" : r.rank;
    return "<tr" + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + ">" +
      '<td class="pos">' + posNum + movHTML(r) + "</td>" +
      '<td class="par"><span class="a">' + esc(label(r.pair)) + '</span><span class="b">' + esc(r.pair.p1 + " · " + r.pair.p2) + "</span></td>" +

    var hay = (label(r.pair) + " " + r.pair.p1 + " " + r.pair.p2 + " " + (r.pair.name || "")).toLowerCase();

  function wireBoard() {

        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        var i = tabs.indexOf(btn);
        var j = (i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
        setRegion(tabs[j].getAttribute("data-r"), true);

  }
  function setHash(h) {
    if ("#" + h === location.hash) return;

  }
  window.addEventListener("hashchange", function () {
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h === "admin") { if (view.mode !== "admin") { view.mode = "admin"; render(); } return; }

  function renderGate() {

  function setBy(path, value) {
    var p = path.split(".");
    if (p[0] === "meta") {
      var k = p[1];
      if (k === "fecha" || k === "winPoints" || k === "lossPoints" || k === "qualify") state.meta[k] = num(value);
      else if (k === "manualPts" || k === "demo") state.meta[k] = !!value;
      else state.meta[k] = String(value);
    } else if (p[0] === "region") {
      var r = regionById(p[1]); if (r) r.label = String(value);
    } else if (p[0] === "pair") {
      var pr = null;
      for (var i = 0; i < state.pairs.length; i++) if (state.pairs[i].id === p[1]) pr = state.pairs[i];
      if (pr) pr[p[2]] = String(value);
    } else if (p[0] === "st") {
      var cell = state.standings[p[1]] && state.standings[p[1]][p[2]];
      if (cell) {
        var f = p[3];
        if (f === "pts") cell.pts = num(value);
        else cell[f] = Math.max(0, num(value));
      }
    }
    view.dirty = true;
    saveDraft();
  }

  function wireAdmin() {
    var root = app.querySelector(".admin");
    root.addEventListener("input", function (e) {

      var b = el.getAttribute("data-b");
      setBy(b, el.type === "checkbox" ? el.checked : el.value);
      if (b.indexOf("st.") === 0 && !state.meta.manualPts) {
        var tr = el.closest("tr[data-pid]");
        if (tr) { var g = tr.querySelector(".gp"); if (g) g.textContent = ptsOf(state.standings[view.adminRegion][tr.getAttribute("data-pid")]); }
      }
      var st = app.querySelector(".abar .st");
      if (st) { st.textContent = "Cambios sin publicar."; st.className = "st w"; }
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.id === "areg") { view.adminRegion = el.value; return renderAdmin(); }
      if (el.getAttribute && el.getAttribute("data-b") === "meta.manualPts") return renderAdmin();
    });
    root.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-a]") : null;

      if (a === "back") backToBoard();

      else if (a === "discard") discardDraft();
      else if (a === "addpair") addPair();
      else if (a === "delpair") delPair(b.getAttribute("data-pid"));
      else if (a === "imppairs") impPairs();
      else if (a === "setpw") setPw();
      else if (a === "draft") { saveDraft(); flash("Borrador guardado en este navegador."); }
      else if (a === "download") downloadPage();
      else if (a === "expjson") expJSON();
      else if (a === "impjson") impJSON();
      else if (a === "impjsongo") impJSONGo();
    });
    var mta = root.querySelector(".msg textarea[readonly]");
    if (mta) mta.addEventListener("focus", function () { try { mta.select(); } catch (e) {} });
  }
  function flash(t) { var s = app.querySelector(".abar .st"); if (s) { s.textContent = t; s.className = "st k"; } }

  function addPair() {
    var k = state.pairs.length + 1, id;
    do { id = "p" + (k < 10 ? "0" : "") + k; k++; } while (state.pairs.some(function (p) { return p.id === id; }));
    state.pairs.push({ id: id, name: "", p1: "", p2: "" });
    state.meta.regions.forEach(function (r) { state.standings[r.id][id] = blank(); });
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function delPair(pid) {
    if (!pid || !confirm("¿Quitar esta pareja y sus resultados en las tres sedes?")) return;
    state.pairs = state.pairs.filter(function (p) { return p.id !== pid; });
    state.meta.regions.forEach(function (r) { if (state.standings[r.id]) delete state.standings[r.id][pid]; });
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function impPairs() {
    var ta = app.querySelector("#ip");
    var lines = (ta ? ta.value : "").split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    if (!confirm("Reemplazar las " + state.pairs.length + " parejas por " + lines.length + " y poner los resultados en cero?")) return;
    state.pairs = lines.map(function (l, i) {
      var q = l.split(/[;|\t]/).map(function (s) { return s.trim(); });
      return { id: "p" + (i + 1 < 10 ? "0" : "") + (i + 1), name: q[2] || "", p1: q[0] || "", p2: q[1] || "" };
    });
    state.standings = {};
    state.meta.regions.forEach(function (r) {
      state.standings[r.id] = {};
      state.pairs.forEach(function (p) { state.standings[r.id][p.id] = blank(); });
    });
    state.meta.demo = false;
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function setPw() {
    var a = app.querySelector("#p1").value, b = app.querySelector("#p2").value, pm = app.querySelector("#pm");
    if (a.length < 4) { pm.textContent = "Mínimo 4 caracteres."; return; }
    if (a !== b) { pm.textContent = "No coinciden."; return; }
    state.meta.adminHash = hashPass(a);
    try { sessionStorage.setItem(SS, state.meta.adminHash); } catch (e) {}
    view.dirty = true; saveDraft();
    app.querySelector("#p1").value = ""; app.querySelector("#p2").value = "";
    pm.textContent = "Cambiada. Se aplica al publicar la página nueva.";
  }

  function buildDocument(st) {
    var css = document.getElementById("sheet").textContent;
    var js = document.getElementById("logic").textContent;
    var json = JSON.stringify(st).replace(/</g, "\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
    var S = "<" + "script", E = "<" + "/script>";
    return [
      "<!doctype html>", '<html lang="es" dir="ltr">', "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<meta name="color-scheme" content="light dark">',
      "<title>" + esc(st.meta.leagueName) + "</title>",
      '<meta name="description" content="Tabla de posiciones de ' + esc(st.meta.leagueName) + '.">',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT + '">',
      '<style id="sheet">' + css + "</style>", "</head>", "<body>",
      '<div id="app"></div>',
      S + ' type="application/json" id="state">' + json + E,
      S + ' id="logic">' + js + E,
      "</body>", "</html>", ""
    ].join("\n");
  }
  function rankIds(st, rid) {
    var m = st.meta, tbl = st.standings[rid] || {};
    var rows = st.pairs.map(function (p) {
      var s = tbl[p.id] || blank();
      var pg = num(s.pg), pp = num(s.pp);
      var pts = m.manualPts ? num(s.pts) : (pg * m.winPoints + pp * m.lossPoints);
      return { pid: p.id, pts: pts, pg: pg, pp: pp, name: label(p) };
    });
    rows.sort(function (a, b) { return b.pts - a.pts || b.pg - a.pg || a.pp - b.pp || a.name.localeCompare(b.name, "es"); });
    return rows;
  }
  function downloadBlob(name, text, type) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      if (a.parentNode) a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { return false; }
  }
  function claudeDownloads() {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    try { return Promise.resolve(window.claude.use("downloads")); } catch (e) { return Promise.resolve(null); }
  }
  function downloadPage() {
    var nf = app.querySelector("#nf") && app.querySelector("#nf").checked;
    var out = JSON.parse(JSON.stringify(state));
    normalize(out);
    if (nf) out.meta.regions.forEach(function (r) {
      rankIds(out, r.id).forEach(function (row, i) { out.standings[r.id][row.pid].prevRank = i + 1; });
    });
    out.meta.updatedAt = todayISO();
    var html = buildDocument(out);
    var okMsg = "Descargado <b>index.html</b>. Subilo a tu hosting reemplazando el anterior para publicar los cambios.";
    var done = function () {
      state = out; normalize(state);
      view.dirty = false; saveDraft();
      view.msg = okMsg; renderAdmin();
    };
    claudeDownloads().then(function (dl) {
      if (dl) {
        dl.save({ filename: "index.html", data: html }).then(done, function (err) {
          if (err && err.code === "declined") { view.msg = "Descarga cancelada."; renderAdmin(); return; }
          if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
        });
      } else {
        if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
      }
    });
  }
  function copyFallback(html) {
    view.msg = "No se pudo descargar acá. Copiá este texto y pegalo reemplazando el contenido de tu <b>index.html</b>:<textarea readonly>" + esc(html) + "</textarea>";
    renderAdmin();
  }
  function expJSON() {
    var data = JSON.stringify(state, null, 1);
    claudeDownloads().then(function (dl) {
      var fb = function () { if (!downloadBlob("liga-truco.json", data, "application/json")) { view.msg = "Guardá este texto como <code>liga-truco.json</code>:<textarea readonly>" + esc(data) + "</textarea>"; renderAdmin(); } };
      if (dl) dl.save({ filename: "liga-truco.json", data: data }).then(function () {}, fb);
      else fb();
    });
  }
  function impJSON() {
    view.msg = "Pegá el contenido del JSON:<textarea id=\"ij\"></textarea><button class=\"btn o s\" type=\"button\" data-a=\"impjsongo\" style=\"margin-top:7px\">Cargar</button>";
    renderAdmin();
  }
  function impJSONGo() {
    var ta = app.querySelector("#ij"); if (!ta) return;
    try {
      var parsed = JSON.parse(ta.value);
      if (!parsed || !parsed.pairs || !parsed.meta) throw new Error("formato");
      state = parsed; normalize(state);
      view.adminRegion = state.meta.regions[0].id; view.dirty = true; saveDraft();
      view.msg = "Datos importados."; renderAdmin();
    } catch (e) { alert("No se pudo leer ese JSON."); }
  }

  initTheme();
  initFromUrl();
  render();
})();
</script>
</body>
</html>
