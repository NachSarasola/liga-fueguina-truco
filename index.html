<style id="sheet">
:root{
  color-scheme:light dark;
  --bg:#f5f3ee; --surface:#eceae1; --surface-2:#e2dfd3;
  --ink:#1c1a15; --ink-2:#57534a; --ink-3:#6b665a;
  --rule:#dcd8cc; --rule-2:#b7b1a1;
  --accent:#2a4c72; --accent-soft:rgba(42,76,114,.10);
  --up:#2f6b45; --down:#9a4630;
  --radius:2px;
  --head:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --surface:#201e16; --surface-2:#2b271d;
    --ink:#ece8dc; --ink-2:#a9a390; --ink-3:#948d7b;
    --rule:rgba(236,232,220,.13); --rule-2:rgba(236,232,220,.28);
    --accent:#84a9d6; --accent-soft:rgba(132,169,214,.13);
    --up:#6cbd8b; --down:#dd8f70;
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --surface:#201e16; --surface-2:#2b271d;
  --ink:#ece8dc; --ink-2:#a9a390; --ink-3:#948d7b;
  --rule:rgba(236,232,220,.13); --rule-2:rgba(236,232,220,.28);
  --accent:#84a9d6; --accent-soft:rgba(132,169,214,.13);
  --up:#6cbd8b; --down:#dd8f70;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
::selection{background:var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

.wrap{max-width:940px;margin:0 auto;padding:0 clamp(14px,3.5vw,32px)}
.admin.wrap{max-width:680px;padding-bottom:120px}

/* masthead */
header.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:22px 0 10px;border-bottom:2px solid var(--ink)}
header.mast h1{margin:0;font:700 clamp(21px,3vw,29px)/1.04 var(--head);letter-spacing:.01em;text-transform:uppercase}
header.mast .sub{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
header.mast .rnd{flex:0 0 auto;font:700 13px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;padding-top:4px}

/* region tabs */
nav.regions{position:sticky;top:0;z-index:5;display:flex;background:var(--bg);border-bottom:1px solid var(--rule-2)}
nav.regions button{appearance:none;flex:0 1 auto;margin-bottom:-1px;padding:11px 16px 9px;background:none;border:0;border-bottom:2px solid transparent;font:600 12px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);cursor:pointer;white-space:nowrap;transition:color .12s}
nav.regions button:hover{color:var(--ink)}
nav.regions button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.regions button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
@media (max-width:560px){nav.regions button{flex:1 1 0;padding:11px 4px 9px;font-size:11px;letter-spacing:.02em;text-align:center}}

/* toolbar */
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:12px 0 6px;font-size:11.5px;color:var(--ink-3)}
.bar .demo{color:var(--ink-3)}
input[type="search"]{appearance:none;width:210px;max-width:52vw;font:400 12.5px var(--body);color:var(--ink);padding:6px 9px;background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--radius)}
input[type="search"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* table */
.tw{overflow-x:auto}
table.pos{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums lining-nums}
table.pos thead th{font:600 10.5px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 8px 6px;border-bottom:2px solid var(--ink);white-space:nowrap}
table.pos thead th.pos,table.pos thead th.par{text-align:left}
table.pos tbody td{padding:8px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
table.pos tbody td.pos{text-align:left;color:var(--ink-3);font:600 12px/1 var(--head);width:2.6rem}
table.pos tbody td.pos .mv{margin-left:4px;font-size:9.5px;font-weight:700}
.mv.up{color:var(--up)} .mv.down{color:var(--down)}
table.pos tbody td.par{text-align:left;white-space:normal}
.par .a{font-weight:600}
.par .b{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
table.pos tbody td.pts{font-weight:700;font-size:14px}
table.pos tbody tr:hover td{background:var(--surface)}
table.pos tbody tr.top td.pos{color:var(--ink)}
table.pos tbody tr.cut td{border-bottom:2px solid var(--rule-2)}
.emptyrow td{padding:24px 8px!important;text-align:center!important;color:var(--ink-2);font-style:italic}
@media (max-width:640px){table.pos .ccf,table.pos .ccc{display:none}}
@media (max-width:560px){table.pos tbody td.par .b{display:none}table.pos tbody td{padding:9px 7px}table.pos tbody td.pos{width:2.1rem}}
@media (max-width:520px){table.pos .cpe,table.pos .cpj{display:none}}

/* footer */
footer.foot{margin:16px 0 40px;padding-top:12px;border-top:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;font-size:11px;color:var(--ink-2)}
footer.foot .rule{max-width:60ch}
footer.foot .act{display:flex;gap:14px;white-space:nowrap}
.lk{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* admin */
.atop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 0 10px;border-bottom:2px solid var(--ink)}
.atop h2{margin:0;font:700 17px/1 var(--head);letter-spacing:.03em;text-transform:uppercase}
.gate{max-width:320px;margin:52px auto}
.gate h2{font:700 16px/1 var(--head);letter-spacing:.03em;text-transform:uppercase;margin:0 0 14px}
.g{margin:0;padding:16px 0 2px}
.g+.g{border-top:1px solid var(--rule-2);margin-top:4px}
.g .gh{margin:0;font:600 10.5px/1 var(--head);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fr{margin:11px 0 0}
.fg{display:flex;flex-wrap:wrap;gap:11px;margin-top:11px}
.fg>.fr{flex:1 1 150px;margin-top:0}
.admin label.l{display:block;margin:0 0 3px;font-size:11px;color:var(--ink-2)}
.admin input[type=text],.admin input[type=number],.admin input[type=password],.admin select,.admin textarea{width:100%;font:400 13px var(--body);color:var(--ink);padding:6px 8px;background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--radius)}
.admin input:focus-visible,.admin select:focus-visible,.admin textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.admin textarea{min-height:80px;resize:vertical;font:400 12px var(--body)}
.admin .ck{display:flex;gap:7px;align-items:flex-start;font-size:12px;margin:11px 0 0}
.admin .ck input{margin-top:2px;flex:0 0 auto}
.pe{display:flex;flex-direction:column;margin-top:9px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px 0;border-bottom:1px solid var(--rule)}
.pl .nm{grid-column:1/-1}
.pl .rm{grid-column:1/-1;justify-self:end;appearance:none;border:0;background:none;color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-size:11px}
table.grid{width:100%;border-collapse:collapse;margin-top:11px;font-variant-numeric:tabular-nums}
table.grid th{font:600 9.5px/1 var(--head);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 5px 5px;border-bottom:1px solid var(--rule-2)}
table.grid th:first-child{text-align:left}
table.grid td{padding:3px 5px;border-bottom:1px solid var(--rule);text-align:right}
table.grid td:first-child{text-align:left;font-size:12px}
table.grid input{width:3rem;text-align:right;padding:4px 5px;font:400 12px var(--body);background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--radius);color:var(--ink)}
table.grid .gp{font-weight:700}
.btn{appearance:none;font:600 12.5px var(--body);padding:8px 14px;border-radius:var(--radius);border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.o{background:none;color:var(--ink)}
.btn.s{padding:5px 9px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.abar{position:sticky;bottom:0;z-index:5;margin-top:20px;padding:11px 0;background:var(--bg);border-top:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.abar .st{flex:1 1 100%;font:400 11px/1.4 var(--body);color:var(--ink-2)}
.abar .st.w{color:var(--down)} .abar .st.k{color:var(--up)}
.msg{position:relative;margin-top:12px;padding:9px 26px 9px 10px;font-size:11.5px;line-height:1.5;border:1px solid var(--rule-2);border-left:2px solid var(--accent);border-radius:var(--radius);color:var(--ink);background:var(--surface)}
.msg .x{position:absolute;top:4px;right:6px;background:none;border:0;color:var(--ink-2);font-size:14px;cursor:pointer;line-height:1}
.msg textarea{width:100%;min-height:110px;margin-top:7px;font:400 10.5px var(--body)}
details.bk summary{font-size:11.5px;color:var(--accent);cursor:pointer}
code{font-size:11px;background:var(--surface);padding:1px 3px;border-radius:2px}
</style>
</head>

<script id="logic">
(function () {
  "use strict";
  var app = document.getElementById("app");
  var LS = { region: "ligaTruco.region", theme: "ligaTruco.theme", draft: "ligaTruco.draft" };
  var SS = "ligaTruco.auth";
  var FONT = "https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@600;700&display=swap";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function num(v) { var n = parseInt(v, 10); return isFinite(n) ? n : 0; }
  function hasInt(v) { return isFinite(parseInt(v, 10)); }
  function surname(full) { var p = String(full || "").trim().split(/\s+/); return p[p.length - 1] || ""; }
  var MES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ""));
    return m ? (+m[3]) + " " + (MES[+m[2] - 1] || "") + " " + m[1] : String(iso || "");
  }
  function todayISO() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function cyrb53(str, seed) {
    seed = seed || 0;
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {

    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    var o = (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    while (o.length < 14) o = "0" + o;
    return o;
  }
  function hashPass(s) { return "cyrb53:" + cyrb53(String(s)); }

  var state;
  try { state = JSON.parse(document.getElementById("state").textContent); }
  catch (e) { app.textContent = "No se pudo leer el estado de la liga."; return; }
  normalize(state);

  function blank() { return { pg: 0, pe: 0, pp: 0, cf: 0, cc: 0, adj: 0, prevRank: 0 }; }

  function normalize(st) {
    var m = st.meta = st.meta || {};
    m.leagueName = m.leagueName || "Liga de Truco";
    m.subtitle = m.subtitle || "";
    m.season = m.season || String(new Date().getFullYear());
    m.fecha = num(m.fecha);
    m.updatedAt = m.updatedAt || todayISO();
    m.winPoints = hasInt(m.winPoints) ? num(m.winPoints) : 3;
    m.drawPoints = hasInt(m.drawPoints) ? num(m.drawPoints) : 1;
    m.lossPoints = hasInt(m.lossPoints) ? num(m.lossPoints) : 0;
    m.manualPts = !!m.manualPts;
    m.qualify = hasInt(m.qualify) ? num(m.qualify) : 0;
    m.demo = !!m.demo;
    if (!Array.isArray(m.regions) || !m.regions.length) {
      m.regions = [{ id: "ushuaia", label: "Ushuaia" }, { id: "riogrande", label: "Río Grande" }, { id: "provincial", label: "Provincial" }];
    }
    m.regions = m.regions.map(function (r, i) {
      return { id: String(r && r.id ? r.id : "r" + i), label: String(r && r.label ? r.label : (r && r.id) || "Sede " + (i + 1)) };
    });
    if (!m.regions.some(function (r) { return r.id === m.defaultRegion; })) m.defaultRegion = m.regions[0].id;
    if (!m.adminHash) m.adminHash = hashPass("truco2026");

    st.pairs = (Array.isArray(st.pairs) ? st.pairs : []).map(function (p, i) {
      p = p || {};
      return {
        id: String(p.id || "p" + (i + 1 < 10 ? "0" : "") + (i + 1)),
        name: String(p.name || ""), p1: String(p.p1 || ""), p2: String(p.p2 || "")
      };
    });

    st.standings = st.standings && typeof st.standings === "object" ? st.standings : {};
    m.regions.forEach(function (r) {
      var src = st.standings[r.id] && typeof st.standings[r.id] === "object" ? st.standings[r.id] : {};
      var out = {};
      st.pairs.forEach(function (p) {
        var s = src[p.id] || {};
        var cf = hasInt(s.cf) ? num(s.cf) : (num(s.dif) > 0 ? num(s.dif) : 0);
        var cc = hasInt(s.cc) ? num(s.cc) : (num(s.dif) < 0 ? -num(s.dif) : 0);
        out[p.id] = {
          pg: Math.max(0, num(s.pg)), pe: Math.max(0, num(s.pe)), pp: Math.max(0, num(s.pp)),
          cf: Math.max(0, cf), cc: Math.max(0, cc), adj: num(s.adj),
          pts: hasInt(s.pts) ? num(s.pts) : (num(s.pg) * m.winPoints + num(s.pe) * m.drawPoints + num(s.pp) * m.lossPoints + num(s.adj)),
          prevRank: num(s.prevRank)
        };
      });
      st.standings[r.id] = out;
    });
  }

  var view = { mode: "board", region: null, query: "", authed: false, adminRegion: null, dirty: false, msg: null, draftInfo: null };

  function regionById(id) { for (var i = 0; i < state.meta.regions.length; i++) if (state.meta.regions[i].id === id) return state.meta.regions[i]; return null; }
  function currentRegion() { return regionById(view.region) || state.meta.regions[0]; }

  function initFromUrl() {
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h === "admin") view.mode = "admin";
    var want = h && h !== "admin" ? h : null;
    if (!want) { try { want = localStorage.getItem(LS.region); } catch (e) {} }
    view.region = regionById(want) ? want : state.meta.defaultRegion;
    view.adminRegion = view.region;
    try { if (sessionStorage.getItem(SS) === state.meta.adminHash) view.authed = true; } catch (e) {}
  }

  function ptsOf(s) {
    var m = state.meta;
    return m.manualPts ? num(s.pts) : (num(s.pg) * m.winPoints + num(s.pe) * m.drawPoints + num(s.pp) * m.lossPoints + num(s.adj));
  }
  function computeRows(regionId) {
    var tbl = state.standings[regionId] || {};
    var rows = state.pairs.map(function (p) {
      var s = tbl[p.id] || blank();
      var pg = num(s.pg), pe = num(s.pe), pp = num(s.pp), cf = num(s.cf), cc = num(s.cc);
      return { pair: p, pg: pg, pe: pe, pp: pp, pj: pg + pe + pp, cf: cf, cc: cc, dif: cf - cc, pts: ptsOf(s), prevRank: num(s.prevRank) };
    });
    rows.sort(function (a, b) {
      return b.pts - a.pts || b.dif - a.dif || b.cf - a.cf || b.pg - a.pg || label(a.pair).localeCompare(label(b.pair), "es");
    });
    rows.forEach(function (r, i) { r.rank = i + 1; r.mov = r.prevRank ? (r.prevRank - r.rank) : 0; });
    return rows;
  }
  function label(p) { return p.name ? p.name : (surname(p.p1) + " / " + surname(p.p2)); }

  function initTheme() {
    var t = null;
    try { t = localStorage.getItem(LS.theme); } catch (e) {}
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  }
  function isDark() {
    var c = document.documentElement.getAttribute("data-theme");
    return c ? c === "dark" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function toggleTheme() {
    var n = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", n);
    try { localStorage.setItem(LS.theme, n); } catch (e) {}
    render();
  }

  function render() {
    if (view.mode === "admin") return view.authed ? renderAdmin() : renderGate();
    renderBoard();
  }

  function movHTML(r) {
    if (!r.prevRank || r.mov === 0) return "";
    var c = r.mov > 0 ? "up" : "down";
    return ' <span class="mv ' + c + '">' + (r.mov > 0 ? "+" : "−") + Math.abs(r.mov) + "</span>";
  }
  function rowHTML(r) {
    var cls = [];
    if (r.rank <= 3) cls.push("top");
    if (state.meta.qualify && r.rank === state.meta.qualify && state.meta.qualify < state.pairs.length) cls.push("cut");
    return "<tr" + (cls.length ? ' class="' + cls.join(" ") + '"' : "") + ">" +
      '<td class="pos">' + r.rank + movHTML(r) + "</td>" +
      '<td class="par"><span class="a">' + esc(label(r.pair)) + '</span><span class="b">' + esc(r.pair.p1 + " · " + r.pair.p2) + "</span></td>" +
      '<td class="cpj">' + r.pj + "</td>" +
      '<td class="cpg">' + r.pg + "</td>" +
      '<td class="cpe">' + r.pe + "</td>" +
      '<td class="cpp">' + r.pp + "</td>" +
      '<td class="ccf">' + r.cf + "</td>" +
      '<td class="ccc">' + r.cc + "</td>" +
      "<td>" + (r.dif > 0 ? "+" + r.dif : r.dif) + "</td>" +
      '<td class="pts">' + r.pts + "</td></tr>";
  }

  function renderBoard() {
    var m = state.meta, region = currentRegion();
    var rows = computeRows(region.id);
    var shown = view.query ? rows.filter(function (r) { return matchQuery(r, view.query); }) : rows;
    var pts = m.manualPts ? "" : (m.winPoints + " pts por partido ganado, " + m.drawPoints + " por empate. ");

    var tabs = m.regions.map(function (r) {
      var on = r.id === region.id;
      return '<button role="tab" id="t-' + esc(r.id) + '" aria-selected="' + on + '" tabindex="' + (on ? "0" : "-1") + '" data-r="' + esc(r.id) + '">' + esc(r.label) + "</button>";

    app.innerHTML =
      '<div class="wrap">' +
        '<header class="mast">' +
          "<div><h1>" + esc(m.leagueName) + "</h1>" +
          '<p class="sub">' + esc(m.subtitle || "") + (m.subtitle ? " · " : "") + "Temporada " + esc(m.season) + "</p></div>" +
          '<div class="rnd">Fecha ' + esc(m.fecha) + "</div>" +
        "</header>" +
        '<nav class="regions" role="tablist" aria-label="Sede">' + tabs + "</nav>" +
        '<div class="bar">' +
          "<span>" + (view.query ? shown.length + " de " + rows.length + " parejas" : "") + (m.demo ? (view.query ? " · " : "") + '<span class="demo">datos de ejemplo</span>' : "") + "</span>" +
          '<input type="search" id="q" placeholder="Buscar jugador o pareja" value="' + esc(view.query) + '" autocomplete="off" spellcheck="false">' +
        "</div>" +
        '<div class="tw"><table class="pos"><thead><tr>' +
          '<th class="pos">#</th><th class="par">Pareja</th>' +
          '<th class="cpj">PJ</th><th class="cpg">PG</th><th class="cpe">PE</th><th class="cpp">PP</th>' +
          '<th class="ccf" title="Chicos a favor">CF</th><th class="ccc" title="Chicos en contra">CC</th>' +
          '<th title="Diferencia de chicos">Dif</th><th>Pts</th>' +
        "</tr></thead><tbody>" +
          (shown.length ? shown.map(function (r) { return rowHTML(r); }).join("")
            : '<tr class="emptyrow"><td colspan="10">Sin resultados para “' + esc(view.query) + '”.</td></tr>') +
        "</tbody></table></div>" +
        '<footer class="foot">' +
          '<span class="rule">' + pts + (m.qualify && m.qualify < state.pairs.length ? "Clasifican a la final los primeros " + m.qualify + ". " : "") + "Desempate por diferencia de chicos.</span>" +
          '<span class="act"><span>Actualizada ' + esc(fmtDate(m.updatedAt)) + '</span>' +
            '<button class="lk" data-a="theme">' + (isDark() ? "Tema claro" : "Tema oscuro") + "</button>" +
            '<button class="lk" data-a="admin">Panel</button></span>' +
        "</footer>" +
      "</div>";
    wireBoard();
  }

  function matchQuery(r, q) {
    var hay = (label(r.pair) + " " + r.pair.p1 + " " + r.pair.p2 + " " + (r.pair.name || "")).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function (t) { return hay.indexOf(t) >= 0; });
  }
  function softBoard() {
    var region = currentRegion();
    var rows = computeRows(region.id);
    var shown = view.query ? rows.filter(function (r) { return matchQuery(r, view.query); }) : rows;
    var tb = app.querySelector("table.pos tbody");
    if (tb) tb.innerHTML = shown.length ? shown.map(function (r) { return rowHTML(r); }).join("")
      : '<tr class="emptyrow"><td colspan="10">Sin resultados para “' + esc(view.query) + '”.</td></tr>';
    var b = app.querySelector(".bar span");
    if (b) b.innerHTML = (view.query ? shown.length + " de " + rows.length + " parejas" : "") +
      (state.meta.demo ? (view.query ? " · " : "") + '<span class="demo">datos de ejemplo</span>' : "");
  }

  function wireBoard() {
    var tabs = Array.prototype.slice.call(app.querySelectorAll("nav.regions button"));
    tabs.forEach(function (btn) {
      btn.addEventListener("click", function () { setRegion(btn.getAttribute("data-r"), false); });
      btn.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
        e.preventDefault();
        var i = tabs.indexOf(btn);
        var j = (i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
        setRegion(tabs[j].getAttribute("data-r"), true);
      });
    });
    var q = app.querySelector("#q");
    if (q) q.addEventListener("input", function () { view.query = q.value; softBoard(); });
    app.querySelectorAll("[data-a]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.getAttribute("data-a");
        if (a === "theme") toggleTheme();
        else if (a === "admin") { view.mode = "admin"; setHash("admin"); render(); }
      });
    });
  }
  function setRegion(id, focusTab) {
    if (!regionById(id)) return;
    view.region = id; view.query = "";
    try { localStorage.setItem(LS.region, id); } catch (e) {}

    renderBoard();
    if (focusTab) { var t = app.querySelector('nav.regions button[aria-selected="true"]'); if (t) t.focus(); }
  }
  function setHash(h) {
    if ("#" + h === location.hash) return;
    try { history.replaceState(null, "", "#" + h); } catch (e) { location.hash = h; }
  }
  window.addEventListener("hashchange", function () {
    var h = (location.hash || "").replace(/^#/, "").toLowerCase();
    if (h === "admin") { if (view.mode !== "admin") { view.mode = "admin"; render(); } return; }
    if (regionById(h)) { view.mode = "board"; view.region = h; renderBoard(); }
  });

  function renderGate() {
    app.innerHTML =
      '<div class="wrap admin"><div class="gate">' +
        "<h2>Panel</h2>" +
        '<form id="gf">' +
          '<div class="fr"><label class="l" for="pw">Contraseña</label><input type="password" id="pw" autocomplete="current-password"></div>' +
          '<p class="msg" id="ge" role="alert" hidden>Contraseña incorrecta.</p>' +
          '<div class="fr" style="display:flex;gap:9px;margin-top:14px"><button class="btn" type="submit">Entrar</button>' +
          '<button class="btn o" type="button" data-a="back">Volver</button></div>' +
        "</form>" +
      "</div></div>";
    var f = app.querySelector("#gf");
    f.addEventListener("submit", function (e) {
      e.preventDefault();
      if (hashPass(app.querySelector("#pw").value) === state.meta.adminHash) {
        view.authed = true;
        try { sessionStorage.setItem(SS, state.meta.adminHash); } catch (err) {}
        loadDraft();
        renderAdmin();
      } else { app.querySelector("#ge").hidden = false; }
    });
    app.querySelector('[data-a="back"]').addEventListener("click", backToBoard);
    setTimeout(function () { var p = app.querySelector("#pw"); if (p) p.focus(); }, 30);
  }
  function backToBoard() { view.mode = "board"; view.msg = null; setHash(view.region); renderBoard(); }

  function loadDraft() {
    try {
      var raw = localStorage.getItem(LS.draft);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && d.state && d.state.pairs && d.state.meta) {
        state = d.state; normalize(state);
        view.draftInfo = d.savedAt || true; view.dirty = true;
      }
    } catch (e) {}
  }
  function saveDraft() {
    try { localStorage.setItem(LS.draft, JSON.stringify({ savedAt: new Date().toISOString(), state: state })); } catch (e) {}
  }
  function discardDraft() {
    if (!confirm("¿Descartar el borrador local y volver a los últimos datos publicados?")) return;
    try { localStorage.removeItem(LS.draft); } catch (e) {}
    try { location.hash = "admin"; } catch (e) {}
    location.reload();
  }

  function renderAdmin() {
    var m = state.meta;
    if (!regionById(view.adminRegion)) view.adminRegion = m.regions[0].id;
    var ar = view.adminRegion;
    var msg = view.msg; view.msg = null;

    var pairLines = state.pairs.map(function (p, i) {
      return '<div class="pl" data-pid="' + esc(p.id) + '">' +
        '<input type="text" data-b="pair.' + esc(p.id) + '.p1" value="' + esc(p.p1) + '" placeholder="Jugador 1" aria-label="Pareja ' + (i + 1) + ' jugador 1">' +
        '<input type="text" data-b="pair.' + esc(p.id) + '.p2" value="' + esc(p.p2) + '" placeholder="Jugador 2" aria-label="Pareja ' + (i + 1) + ' jugador 2">' +
        '<input class="nm" type="text" data-b="pair.' + esc(p.id) + '.name" value="' + esc(p.name) + '" placeholder="Nombre o club (opcional)" aria-label="Pareja ' + (i + 1) + ' nombre">' +
        '<button class="rm" type="button" data-a="delpair" data-pid="' + esc(p.id) + '" aria-label="Quitar pareja ' + (i + 1) + '">Quitar</button>' +
      "</div>";
    }).join("");

    var grid = state.pairs.map(function (p) {
      var s = state.standings[ar][p.id];
      var pc = m.manualPts
        ? '<input type="number" data-b="st.' + esc(ar) + "." + esc(p.id) + '.pts" value="' + s.pts + '">'
        : '<span class="gp">' + ptsOf(s) + "</span>";
      var f = function (k) { return '<td><input type="number" min="0" inputmode="numeric" data-b="st.' + esc(ar) + "." + esc(p.id) + "." + k + '" value="' + s[k] + '"></td>'; };
      return '<tr data-pid="' + esc(p.id) + '"><td>' + esc(label(p)) + "</td>" +
        f("pg") + f("pe") + f("pp") + f("cf") + f("cc") + "<td>" + pc + "</td></tr>";
    }).join("");

    app.innerHTML =
      '<div class="wrap admin">' +
        '<div class="atop"><h2>' + esc(m.leagueName) + '</h2><button class="lk" data-a="back">Ver la tabla</button></div>' +
        (view.draftInfo ? '<div class="msg">Borrador local sin publicar' +
          (typeof view.draftInfo === "string" ? " (" + esc(fmtDate(view.draftInfo.slice(0, 10))) + ")" : "") +
          '. <button class="lk" data-a="discard">Descartar</button></div>' : "") +
        (msg ? '<div class="msg">' + msg + '<button type="button" class="x" data-a="closemsg" aria-label="Cerrar">×</button></div>' : "") +

        '<div class="g"><p class="gh">Liga</p>' +
          '<div class="fg">' +
            '<div class="fr"><label class="l">Nombre</label><input type="text" data-b="meta.leagueName" value="' + esc(m.leagueName) + '"></div>' +
            '<div class="fr"><label class="l">Subtítulo</label><input type="text" data-b="meta.subtitle" value="' + esc(m.subtitle) + '"></div>' +
          "</div>" +
          '<div class="fg">' +
            '<div class="fr"><label class="l">Temporada</label><input type="text" data-b="meta.season" value="' + esc(m.season) + '"></div>' +
            '<div class="fr"><label class="l">Fecha</label><input type="number" min="0" data-b="meta.fecha" value="' + m.fecha + '"></div>' +
            '<div class="fr"><label class="l">Clasifican (0 = sin corte)</label><input type="number" min="0" data-b="meta.qualify" value="' + m.qualify + '"></div>' +
          "</div>" +
          '<div class="fg">' +
            '<div class="fr"><label class="l">Pts. ganado</label><input type="number" data-b="meta.winPoints" value="' + m.winPoints + '"' + (m.manualPts ? " disabled" : "") + "></div>" +
            '<div class="fr"><label class="l">Pts. empate</label><input type="number" data-b="meta.drawPoints" value="' + m.drawPoints + '"' + (m.manualPts ? " disabled" : "") + "></div>" +
            '<div class="fr"><label class="l">Pts. perdido</label><input type="number" data-b="meta.lossPoints" value="' + m.lossPoints + '"' + (m.manualPts ? " disabled" : "") + "></div>" +
          "</div>" +
          '<div class="fr"><label class="l">Sede al abrir</label><select data-b="meta.defaultRegion">' +
            m.regions.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === m.defaultRegion ? " selected" : "") + ">" + esc(r.label) + "</option>"; }).join("") +
          "</select></div>" +
          '<label class="ck"><input type="checkbox" data-b="meta.manualPts"' + (m.manualPts ? " checked" : "") + "><span>Cargar los puntos a mano</span></label>" +
          '<label class="ck"><input type="checkbox" data-b="meta.demo"' + (m.demo ? " checked" : "") + '><span>Mostrar la marca “datos de ejemplo”</span></label>' +
        "</div>" +

        '<div class="g"><p class="gh">Sedes</p><div class="fg">' +
          m.regions.map(function (r) { return '<div class="fr"><label class="l">' + esc(r.id) + '</label><input type="text" data-b="region.' + esc(r.id) + '.label" value="' + esc(r.label) + '"></div>'; }).join("") +
        "</div></div>" +

        '<div class="g"><p class="gh">Contraseña</p><div class="fg">' +
          '<div class="fr"><label class="l">Nueva</label><input type="password" id="p1" autocomplete="new-password"></div>' +
          '<div class="fr"><label class="l">Repetir</label><input type="password" id="p2" autocomplete="new-password"></div>' +
        '</div><button class="btn o s" type="button" data-a="setpw" style="margin-top:9px">Cambiar</button>' +
        '<span id="pm" style="margin-left:9px;font-size:11px;color:var(--ink-2)"></span></div>' +

        '<div class="g"><p class="gh">Parejas (' + state.pairs.length + ")</p>" +
          '<div class="pe">' + pairLines + "</div>" +
          '<button class="btn o s" type="button" data-a="addpair" style="margin-top:9px">Agregar pareja</button>' +
          '<details class="bk" style="margin-top:10px"><summary>Importar lista</summary>' +
            '<p style="font-size:11px;color:var(--ink-2);margin:7px 0 5px">Una por línea: <code>Jugador 1; Jugador 2; nombre opcional</code>. Reemplaza todo y pone los resultados en cero.</p>' +
            '<textarea id="ip"></textarea>' +
            '<button class="btn o s" type="button" data-a="imppairs" style="margin-top:7px">Reemplazar</button></details>' +
        "</div>" +

        '<div class="g"><p class="gh">Resultados</p>' +
          '<div class="fr" style="max-width:200px"><label class="l">Sede</label><select id="areg">' +
            m.regions.map(function (r) { return '<option value="' + esc(r.id) + '"' + (r.id === ar ? " selected" : "") + ">" + esc(r.label) + "</option>"; }).join("") +
          "</select></div>" +
          '<div class="tw"><table class="grid"><thead><tr><th>Pareja</th><th>PG</th><th>PE</th><th>PP</th><th>CF</th><th>CC</th><th>' + (m.manualPts ? "Pts" : "Pts") + "</th></tr></thead><tbody>" +
            grid +
          "</tbody></table></div>" +
          '<p style="font-size:11px;color:var(--ink-2);margin-top:7px">PJ = PG + PE + PP. CF / CC = chicos a favor / en contra.</p>' +
        "</div>" +

        '<div class="abar">' +
          '<span class="st ' + (view.dirty ? "w" : "") + '">' + (view.dirty ? "Cambios sin publicar." : "Sin cambios pendientes.") + "</span>" +
          '<label class="ck" style="margin:0 6px 0 0"><input type="checkbox" id="nf" checked><span>Nueva fecha (recalcula subió/bajó)</span></label>' +
          '<button class="btn" type="button" data-a="download">Descargar página</button>' +
          '<button class="btn o" type="button" data-a="draft">Guardar borrador</button>' +
          '<details class="bk" style="flex:1 1 100%"><summary>Copia de seguridad</summary>' +
            '<div style="display:flex;gap:9px;margin-top:7px;flex-wrap:wrap">' +
              '<button class="btn o s" type="button" data-a="expjson">Exportar JSON</button>' +
              '<button class="btn o s" type="button" data-a="impjson">Importar JSON</button></div></details>' +
        "</div>" +
      "</div>";
    wireAdmin();
  }

  function setBy(path, value) {
    var p = path.split(".");
    if (p[0] === "meta") {
      var k = p[1];
      if (k === "fecha" || k === "winPoints" || k === "drawPoints" || k === "lossPoints" || k === "qualify") state.meta[k] = num(value);
      else if (k === "manualPts" || k === "demo") state.meta[k] = !!value;
      else state.meta[k] = String(value);
    } else if (p[0] === "region") {
      var r = regionById(p[1]); if (r) r.label = String(value);
    } else if (p[0] === "pair") {
      var pr = null;
      for (var i = 0; i < state.pairs.length; i++) if (state.pairs[i].id === p[1]) pr = state.pairs[i];
      if (pr) pr[p[2]] = String(value);
    } else if (p[0] === "st") {
      var cell = state.standings[p[1]] && state.standings[p[1]][p[2]];
      if (cell) {
        var f = p[3];
        if (f === "adj" || f === "pts") cell[f] = num(value);
        else cell[f] = Math.max(0, num(value));
      }
    }
    view.dirty = true;
    saveDraft();
  }

  function wireAdmin() {
    var root = app.querySelector(".admin");
    root.addEventListener("input", function (e) {
      var el = e.target;
      if (!el.getAttribute || !el.getAttribute("data-b")) return;
      var b = el.getAttribute("data-b");
      setBy(b, el.type === "checkbox" ? el.checked : el.value);
      if (b.indexOf("st.") === 0 && !state.meta.manualPts) {
        var tr = el.closest("tr[data-pid]");
        if (tr) { var g = tr.querySelector(".gp"); if (g) g.textContent = ptsOf(state.standings[view.adminRegion][tr.getAttribute("data-pid")]); }
      }
      var st = app.querySelector(".abar .st");
      if (st) { st.textContent = "Cambios sin publicar."; st.className = "st w"; }
    });
    root.addEventListener("change", function (e) {
      var el = e.target;
      if (el.id === "areg") { view.adminRegion = el.value; return renderAdmin(); }
      if (el.getAttribute && el.getAttribute("data-b") === "meta.manualPts") return renderAdmin();
    });
    root.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-a]") : null;
      if (!b) return;
      var a = b.getAttribute("data-a");
      if (a === "back") backToBoard();
      else if (a === "closemsg") { var mm = b.parentNode; if (mm && mm.parentNode) mm.parentNode.removeChild(mm); }
      else if (a === "discard") discardDraft();
      else if (a === "addpair") addPair();
      else if (a === "delpair") delPair(b.getAttribute("data-pid"));
      else if (a === "imppairs") impPairs();
      else if (a === "setpw") setPw();
      else if (a === "draft") { saveDraft(); flash("Borrador guardado en este navegador."); }
      else if (a === "download") downloadPage();
      else if (a === "expjson") expJSON();
      else if (a === "impjson") impJSON();
      else if (a === "impjsongo") impJSONGo();
    });
    var mta = root.querySelector(".msg textarea[readonly]");
    if (mta) mta.addEventListener("focus", function () { try { mta.select(); } catch (e) {} });
  }
  function flash(t) { var s = app.querySelector(".abar .st"); if (s) { s.textContent = t; s.className = "st k"; } }

  function addPair() {
    var k = state.pairs.length + 1, id;
    do { id = "p" + (k < 10 ? "0" : "") + k; k++; } while (state.pairs.some(function (p) { return p.id === id; }));
    state.pairs.push({ id: id, name: "", p1: "", p2: "" });
    state.meta.regions.forEach(function (r) { state.standings[r.id][id] = blank(); });
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function delPair(pid) {
    if (!pid || !confirm("¿Quitar esta pareja y sus resultados en las tres sedes?")) return;
    state.pairs = state.pairs.filter(function (p) { return p.id !== pid; });
    state.meta.regions.forEach(function (r) { if (state.standings[r.id]) delete state.standings[r.id][pid]; });
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function impPairs() {
    var ta = app.querySelector("#ip");
    var lines = (ta ? ta.value : "").split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
    if (!lines.length) return;
    if (!confirm("Reemplazar las " + state.pairs.length + " parejas por " + lines.length + " y poner los resultados en cero?")) return;
    state.pairs = lines.map(function (l, i) {
      var q = l.split(/[;|\t]/).map(function (s) { return s.trim(); });
      return { id: "p" + (i + 1 < 10 ? "0" : "") + (i + 1), name: q[2] || "", p1: q[0] || "", p2: q[1] || "" };
    });
    state.standings = {};
    state.meta.regions.forEach(function (r) {
      state.standings[r.id] = {};
      state.pairs.forEach(function (p) { state.standings[r.id][p.id] = blank(); });
    });
    state.meta.demo = false;
    view.dirty = true; saveDraft(); renderAdmin();
  }
  function setPw() {
    var a = app.querySelector("#p1").value, b = app.querySelector("#p2").value, pm = app.querySelector("#pm");
    if (a.length < 4) { pm.textContent = "Mínimo 4 caracteres."; return; }
    if (a !== b) { pm.textContent = "No coinciden."; return; }
    state.meta.adminHash = hashPass(a);
    try { sessionStorage.setItem(SS, state.meta.adminHash); } catch (e) {}
    view.dirty = true; saveDraft();
    app.querySelector("#p1").value = ""; app.querySelector("#p2").value = "";
    pm.textContent = "Cambiada. Se aplica al publicar la página nueva.";
  }

  function buildDocument(st) {
    var css = document.getElementById("sheet").textContent;
    var js = document.getElementById("logic").textContent;
    var json = JSON.stringify(st).replace(/</g, "\\u003c").split(String.fromCharCode(8232)).join("\\u2028").split(String.fromCharCode(8233)).join("\\u2029");
    var S = "<" + "script", E = "<" + "/script>";
    return [
      "<!doctype html>", '<html lang="es" dir="ltr">', "<head>",
      '<meta charset="utf-8">',
      '<meta name="viewport" content="width=device-width, initial-scale=1">',
      '<meta name="color-scheme" content="light dark">',
      "<title>" + esc(st.meta.leagueName) + "</title>",
      '<meta name="description" content="Tabla de posiciones de ' + esc(st.meta.leagueName) + '.">',
      '<link rel="preconnect" href="https://fonts.googleapis.com">',
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>',
      '<link rel="stylesheet" href="' + FONT + '">',
      '<style id="sheet">' + css + "</style>", "</head>", "<body>",
      '<div id="app"></div>',
      S + ' type="application/json" id="state">' + json + E,
      S + ' id="logic">' + js + E,
      "</body>", "</html>", ""
    ].join("\n");
  }
  function rankRegion(st, rid) {
    var m = st.meta, tbl = st.standings[rid] || {};
    var rows = st.pairs.map(function (p) {
      var s = tbl[p.id] || blank();
      var pg = num(s.pg), pe = num(s.pe), pp = num(s.pp), cf = num(s.cf), cc = num(s.cc);
      var pts = m.manualPts ? num(s.pts) : (pg * m.winPoints + pe * m.drawPoints + pp * m.lossPoints + num(s.adj));
      return { pid: p.id, pts: pts, dif: cf - cc, cf: cf, pg: pg, name: label(p) };
    });
    rows.sort(function (a, b) { return b.pts - a.pts || b.dif - a.dif || b.cf - a.cf || b.pg - a.pg || a.name.localeCompare(b.name, "es"); });
    return rows;
  }
  function downloadBlob(name, text, type) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: type }));
      var a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      if (a.parentNode) a.parentNode.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
      return true;
    } catch (e) { return false; }
  }
  function claudeDownloads() {
    if (!window.claude || typeof window.claude.use !== "function") return Promise.resolve(null);
    try { return Promise.resolve(window.claude.use("downloads")); } catch (e) { return Promise.resolve(null); }
  }
  function downloadPage() {
    var nf = app.querySelector("#nf") && app.querySelector("#nf").checked;
    var out = JSON.parse(JSON.stringify(state));
    normalize(out);
    if (nf) out.meta.regions.forEach(function (r) {
      rankRegion(out, r.id).forEach(function (row, i) { out.standings[r.id][row.pid].prevRank = i + 1; });
    });
    out.meta.updatedAt = todayISO();
    var html = buildDocument(out);
    var okMsg = "Descargado <b>index.html</b>. Subilo a tu hosting reemplazando el anterior para publicar los cambios.";
    var done = function () {
      state = out; normalize(state);
      view.dirty = false; saveDraft();
      view.msg = okMsg; renderAdmin();
    };
    claudeDownloads().then(function (dl) {
      if (dl) {
        dl.save({ filename: "index.html", data: html }).then(done, function (err) {
          if (err && err.code === "declined") { view.msg = "Descarga cancelada."; renderAdmin(); return; }
          if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
        });
      } else {
        if (downloadBlob("index.html", html, "text/html;charset=utf-8")) done(); else copyFallback(html);
      }
    });
  }
  function copyFallback(html) {
    view.msg = "No se pudo descargar acá. Copiá este texto y pegalo reemplazando el contenido de tu <b>index.html</b>:<textarea readonly>" + esc(html) + "</textarea>";
    renderAdmin();
  }
  function expJSON() {
    var data = JSON.stringify(state, null, 1);
    claudeDownloads().then(function (dl) {
      var fb = function () { if (!downloadBlob("liga-truco.json", data, "application/json")) { view.msg = "Guardá este texto como <code>liga-truco.json</code>:<textarea readonly>" + esc(data) + "</textarea>"; renderAdmin(); } };
      if (dl) dl.save({ filename: "liga-truco.json", data: data }).then(function () {}, fb);
      else fb();
    });
  }
  function impJSON() {
    view.msg = "Pegá el contenido del JSON:<textarea id=\"ij\"></textarea><button class=\"btn o s\" type=\"button\" data-a=\"impjsongo\" style=\"margin-top:7px\">Cargar</button>";
    renderAdmin();
  }
  function impJSONGo() {
    var ta = app.querySelector("#ij"); if (!ta) return;
    try {
      var parsed = JSON.parse(ta.value);
      if (!parsed || !parsed.pairs || !parsed.meta) throw new Error("formato");
      state = parsed; normalize(state);
      view.adminRegion = state.meta.regions[0].id; view.dirty = true; saveDraft();
      view.msg = "Datos importados."; renderAdmin();
    } catch (e) { alert("No se pudo leer ese JSON."); }
  }

  initTheme();
  initFromUrl();
  render();
})();
</script>
</body>
</html>
